<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Strong Cities LA — Map Prototype (Demo Data)</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css" />
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600;9..144,700&family=Public+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --primary: #35503A;
    --primary-dark: #16231A;
    --primary-mid: #4A6E50;
    --secondary: #D9782D;
    --accent: #4B4C7A;
    --offwhite: #F3F4EE;
    --text-dark: #271F1A;
    --text-muted: #5B5347;
    --text-on-dark: #F5F3EE;
    --muted-on-dark: #C9BFA9;
    --border: #E1DDD0;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: 'Public Sans', sans-serif;
    color: var(--text-dark);
    background: var(--offwhite);
  }
  h1, h2, h3, .display {
    font-family: 'Fraunces', serif;
    font-optical-sizing: auto;
  }

  header {
    background: var(--primary-dark);
    color: var(--text-on-dark);
    padding: 0.9rem 1.25rem;
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    flex-wrap: wrap;
    gap: 0.5rem;
  }
  .wordmark {
    font-size: 1.15rem;
    font-weight: 700;
    letter-spacing: 0.03em;
  }
  .tagline {
    font-size: 0.8rem;
    color: var(--muted-on-dark);
    margin-left: 0.75rem;
  }
  .demo-badge {
    background: var(--secondary);
    color: var(--text-on-dark);
    font-size: 0.72rem;
    font-weight: 700;
    letter-spacing: 0.06em;
    text-transform: uppercase;
    padding: 0.3rem 0.6rem;
    border-radius: 4px;
  }

  .layout {
    display: grid;
    grid-template-columns: minmax(0, 1fr) 380px;
    height: calc(100vh - 58px);
  }
  #map { height: 100%; width: 100%; background: var(--offwhite); }

  aside {
    background: #fff;
    border-left: 1px solid var(--border);
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }

  .filters {
    padding: 0.9rem 1rem 0.7rem;
    border-bottom: 1px solid var(--border);
  }
  .filters h2 {
    font-size: 1.3rem;
    margin: 0 0 0.6rem;
    font-weight: 600;
  }
  .chip-row { display: flex; flex-wrap: wrap; gap: 0.4rem; }
  .chip {
    font-family: 'Public Sans', sans-serif;
    font-size: 0.78rem;
    font-weight: 600;
    padding: 0.32rem 0.7rem;
    border-radius: 999px;
    border: 1px solid var(--border);
    background: var(--offwhite);
    color: var(--text-dark);
    cursor: pointer;
    transition: background 0.15s ease, color 0.15s ease, border-color 0.15s ease;
  }
  .chip:hover { border-color: var(--primary-mid); }
  .chip.active { background: var(--primary); color: #fff; border-color: var(--primary); }
  .chip:focus-visible, .list-item:focus-visible, button:focus-visible {
    outline: 2px solid var(--accent);
    outline-offset: 2px;
  }

  .list {
    overflow-y: auto;
    flex: 1;
  }
  .list-item {
    display: flex;
    gap: 0.7rem;
    padding: 0.8rem 1rem;
    border-bottom: 1px solid var(--border);
    cursor: pointer;
    background: #fff;
    width: 100%;
    text-align: left;
    border-left: 3px solid transparent;
    font-family: 'Public Sans', sans-serif;
  }
  .list-item:hover { background: var(--offwhite); }
  .list-item.selected { background: var(--offwhite); border-left-color: var(--secondary); }
  .dot {
    flex: none;
    width: 30px; height: 30px;
    border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    margin-top: 0.1rem;
  }
  .dot svg { width: 16px; height: 16px; fill: #fff; }
  .item-body h3 { margin: 0 0 0.15rem; font-size: 0.98rem; font-weight: 600; }
  .item-body p { margin: 0; font-size: 0.78rem; color: var(--text-muted); line-height: 1.35; }
  .item-meta { font-size: 0.7rem; color: var(--text-muted); margin-top: 0.25rem; text-transform: uppercase; letter-spacing: 0.03em; }

  .detail-panel {
    position: absolute;
    right: 0; top: 58px; bottom: 0;
    width: 380px;
    background: #fff;
    border-left: 1px solid var(--border);
    transform: translateX(100%);
    transition: transform 0.25s ease;
    overflow-y: auto;
    z-index: 500;
  }
  .detail-panel.open { transform: translateX(0); }
  .detail-photo {
    height: 190px;
    background: linear-gradient(135deg, var(--primary-mid), var(--primary));
    display: flex; align-items: center; justify-content: center;
    color: var(--muted-on-dark);
    font-size: 0.8rem;
    text-align: center;
    position: relative;
  }
  .detail-photo svg { width: 40px; height: 40px; fill: rgba(255,255,255,0.5); }
  .close-btn {
    position: absolute; top: 0.7rem; left: 0.7rem;
    background: rgba(22,35,26,0.55);
    color: #fff; border: none; border-radius: 6px;
    width: 30px; height: 30px; cursor: pointer; font-size: 1rem;
  }
  .detail-body { padding: 1.1rem 1.2rem 1.5rem; }
  .type-badge {
    display: inline-block;
    font-size: 0.7rem; font-weight: 700; letter-spacing: 0.04em; text-transform: uppercase;
    padding: 0.25rem 0.55rem; border-radius: 4px;
    color: #fff; margin-bottom: 0.6rem;
  }
  .detail-body h2 { font-size: 1.4rem; margin: 0 0 0.5rem; font-weight: 600; }
  .detail-body p.desc { font-size: 0.9rem; line-height: 1.5; color: var(--text-dark); margin: 0 0 1rem; }
  .tag-row { display: flex; flex-wrap: wrap; gap: 0.35rem; margin-bottom: 1rem; }
  .tag { font-size: 0.72rem; background: var(--offwhite); border: 1px solid var(--border); border-radius: 999px; padding: 0.22rem 0.55rem; color: var(--text-muted); }
  .meta-row { display: flex; justify-content: space-between; font-size: 0.8rem; padding: 0.5rem 0; border-top: 1px solid var(--border); color: var(--text-muted); }
  .meta-row strong { color: var(--text-dark); font-weight: 600; }
  .visitor-note { margin-top: 1rem; padding: 0.7rem 0.8rem; background: var(--offwhite); border-radius: 6px; font-size: 0.82rem; color: var(--text-dark); }

  .leaflet-popup-content-wrapper { border-radius: 6px; }

  @media (max-width: 820px) {
    .layout { grid-template-columns: 1fr; grid-template-rows: 45vh 1fr; height: calc(100vh - 74px); }
    aside { border-left: none; border-top: 1px solid var(--border); }
    .detail-panel { width: 100%; top: auto; height: 70vh; bottom: 0; }
  }
</style>
</head>
<body>

<header>
  <div><span class="wordmark">Strong Cities LA</span><span class="tagline">Map & Registry — prototype</span></div>
  <span class="demo-badge">Demo data — not real installations</span>
</header>

<div class="layout">
  <div id="map"></div>
  <aside>
    <div class="filters">
      <h2 class="display">Nearby installations</h2>
      <div class="chip-row" id="chipRow"></div>
    </div>
    <div class="list" id="list"></div>
  </aside>
</div>

<div class="detail-panel" id="detailPanel">
  <button class="close-btn" id="closeDetail" aria-label="Close">&times;</button>
  <div id="detailContent"></div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<script>
// ---------- ICONS (simple inline SVG paths, white fill) ----------
const ICONS = {
  droplet: '<svg viewBox="0 0 24 24"><path d="M12 2C9 7 5 11 5 15a7 7 0 0 0 14 0c0-4-4-8-7-13z"/></svg>',
  leaf: '<svg viewBox="0 0 24 24"><path d="M20 4C10 4 4 10 4 18c0 1 .1 1.6.2 2 .4-.1 1-.2 2-.2 8 0 14-6 14-16 0-.3 0-.6-.2 .2z"/><path d="M4.6 19.4C7 15 12 10 19 6" stroke="#fff" stroke-width="1.4" fill="none" stroke-linecap="round"/></svg>',
  flow: '<svg viewBox="0 0 24 24"><path d="M4 6h16M4 12h10M4 18h16M15 9l3 3-3 3" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>'
};

const CATEGORY = {
  rain_garden: { icon: 'droplet', color: '#4B4C7A', label: 'Water systems' },
  swale: { icon: 'droplet', color: '#4B4C7A', label: 'Water systems' },
  rain_barrel: { icon: 'droplet', color: '#4B4C7A', label: 'Water systems' },
  curb_cut: { icon: 'flow', color: '#D9782D', label: 'Earthworks & access' },
  earthworks: { icon: 'flow', color: '#D9782D', label: 'Earthworks & access' },
  mulch_basin: { icon: 'flow', color: '#D9782D', label: 'Earthworks & access' },
  native_planting: { icon: 'leaf', color: '#35503A', label: 'Planting' },
  dry_garden: { icon: 'leaf', color: '#35503A', label: 'Planting' },
  food_forest: { icon: 'leaf', color: '#35503A', label: 'Planting' },
  other: { icon: 'leaf', color: '#4A6E50', label: 'Other' }
};

const TYPE_LABELS = {
  rain_garden: 'Rain garden', swale: 'Swale', rain_barrel: 'Rain barrel',
  curb_cut: 'Curb cut', earthworks: 'Earthworks', mulch_basin: 'Mulch basin',
  native_planting: 'Native planting', dry_garden: 'Dry garden', food_forest: 'Food forest', other: 'Other'
};

// ---------- DEMO DATA (fictional, for prototype evaluation only) ----------
const installations = [
  {
    id: "demo-001", name: "Corner Rain Garden & Curb Cut", type: "rain_garden",
    techniques: ["curb_cut","swale","native_planting"],
    neighborhood: "Highland Park", lat: 34.1141, lng: -118.1958,
    description: "A street-facing rain garden fed by a legal curb cut, catching runoff from the block before it reaches the storm drain. Planted in wet-to-dry zones from the curb inward.",
    source_type: "diy", installed_year: 2023, visible_from_street: true,
    visitor_notes: "Best viewed from the north side of the street, especially after a rain."
  },
  {
    id: "demo-002", name: "Native Slope Restoration", type: "native_planting",
    techniques: ["native_planting","mulch"],
    neighborhood: "Mount Washington", lat: 34.1058, lng: -118.2201,
    description: "A steep front slope converted from turf to a mixed native planting — coast live oak, sagebrush, and monkeyflower — reducing both watering needs and erosion risk.",
    source_type: "diy", installed_year: 2021, visible_from_street: true,
    visitor_notes: "Visible year-round; spring bloom is the most dramatic time to visit."
  },
  {
    id: "demo-003", name: "Rain Barrel + Drip Integration", type: "rain_barrel",
    techniques: ["rain_barrel","native_planting"],
    neighborhood: "Eagle Rock", lat: 34.1397, lng: -118.2151,
    description: "Two connected rain barrels feed a gravity-fed drip line to a native planting bed, professionally installed as part of a broader landscape renovation.",
    source_type: "professional", installed_year: 2022, visible_from_street: false,
    visitor_notes: "Barrels are visible from the driveway side; ring the bell for a look at the drip system."
  },
  {
    id: "demo-004", name: "Parkway Swale Garden", type: "swale",
    techniques: ["swale","native_planting","mulch"],
    neighborhood: "Echo Park", lat: 34.0782, lng: -118.2606,
    description: "A shallow parkway swale installed by a small group of neighbors on the same block, coordinating water flow across three adjoining properties.",
    source_type: "neighborhood_group", installed_year: 2024, visible_from_street: true,
    visitor_notes: "Ask about the block's shared maintenance schedule if you're curious how coordination works."
  },
  {
    id: "demo-005", name: "Food Forest Front Yard", type: "food_forest",
    techniques: ["native_planting","mulch"],
    neighborhood: "Atwater Village", lat: 34.1153, lng: -118.2626,
    description: "A full front-yard conversion combining native plants with food-bearing species suited to the region, including a mature guava and prickly pear.",
    source_type: "diy", installed_year: 2020, visible_from_street: true,
    visitor_notes: "Fruit is for the birds, not for picking — please admire from the sidewalk."
  },
  {
    id: "demo-006", name: "City Park Bioswale Demonstration", type: "swale",
    techniques: ["swale","earthworks"],
    neighborhood: "El Sereno", lat: 34.0842, lng: -118.1745,
    description: "A city-installed demonstration bioswale at the edge of a public park, with signage explaining how it captures and filters street runoff.",
    source_type: "city", installed_year: 2019, visible_from_street: true,
    visitor_notes: "Interpretive signage on site — a good first stop if you're new to the concept."
  },
  {
    id: "demo-007", name: "Curb Cut & Dry Creek Bed", type: "curb_cut",
    techniques: ["curb_cut","earthworks","native_planting"],
    neighborhood: "Silver Lake", lat: 34.0869, lng: -118.2702,
    description: "A decorative dry creek bed channels curb-cut runoff across the length of the front yard before it infiltrates near the property line.",
    source_type: "diy", installed_year: 2022, visible_from_street: true,
    visitor_notes: "The creek bed is most active during and right after rain."
  },
  {
    id: "demo-008", name: "Mulch Basin & Native Meadow", type: "mulch_basin",
    techniques: ["mulch_basin","native_planting"],
    neighborhood: "Glassell Park", lat: 34.1244, lng: -118.2437,
    description: "Shallow mulch basins around existing trees paired with a low native meadow mix replacing what was previously lawn.",
    source_type: "diy", installed_year: 2023, visible_from_street: true,
    visitor_notes: "Meadow is left uncut through spring for pollinators."
  }
];

// ---------- MAP SETUP ----------
const map = L.map('map', { scrollWheelZoom: true }).setView([34.105, -118.225], 12);
L.tileLayer('https://{s}.basemaps.cartocdn.com/light_all/{z}/{x}/{y}{r}.png', {
  attribution: '&copy; OpenStreetMap contributors &copy; CARTO',
  maxZoom: 19
}).addTo(map);

function makeIcon(type) {
  const cat = CATEGORY[type] || CATEGORY.other;
  return L.divIcon({
    className: '',
    html: `<div style="background:${cat.color};width:30px;height:30px;border-radius:50%;display:flex;align-items:center;justify-content:center;box-shadow:0 1px 4px rgba(0,0,0,0.35);border:2px solid #fff;">
             <div style="width:15px;height:15px;">${ICONS[cat.icon]}</div>
           </div>`,
    iconSize: [30, 30],
    iconAnchor: [15, 15]
  });
}

const markers = {};
installations.forEach(inst => {
  const marker = L.marker([inst.lat, inst.lng], { icon: makeIcon(inst.type) }).addTo(map);
  marker.on('click', () => selectInstallation(inst.id));
  markers[inst.id] = marker;
});

// ---------- FILTER CHIPS ----------
const chipRow = document.getElementById('chipRow');
const categories = ['all', 'Water systems', 'Earthworks & access', 'Planting'];
let activeFilter = 'all';

categories.forEach(cat => {
  const chip = document.createElement('button');
  chip.className = 'chip' + (cat === 'all' ? ' active' : '');
  chip.textContent = cat === 'all' ? 'All' : cat;
  chip.addEventListener('click', () => {
    activeFilter = cat;
    document.querySelectorAll('.chip').forEach(c => c.classList.remove('active'));
    chip.classList.add('active');
    renderList();
  });
  chipRow.appendChild(chip);
});

// ---------- LIST ----------
const listEl = document.getElementById('list');
let selectedId = null;

function renderList() {
  listEl.innerHTML = '';
  installations
    .filter(inst => activeFilter === 'all' || CATEGORY[inst.type].label === activeFilter)
    .forEach(inst => {
      const cat = CATEGORY[inst.type];
      const item = document.createElement('button');
      item.className = 'list-item' + (inst.id === selectedId ? ' selected' : '');
      item.innerHTML = `
        <div class="dot" style="background:${cat.color}">${ICONS[cat.icon].replace('viewBox', 'width="16" height="16" viewBox')}</div>
        <div class="item-body">
          <h3>${inst.name}</h3>
          <p>${inst.neighborhood} · ${TYPE_LABELS[inst.type]}</p>
          <div class="item-meta">${inst.visible_from_street ? 'Visible from street' : 'Limited visibility'}</div>
        </div>`;
      item.addEventListener('click', () => selectInstallation(inst.id));
      listEl.appendChild(item);
    });
}

// ---------- DETAIL PANEL ----------
const detailPanel = document.getElementById('detailPanel');
const detailContent = document.getElementById('detailContent');
document.getElementById('closeDetail').addEventListener('click', () => {
  detailPanel.classList.remove('open');
  selectedId = null;
  renderList();
});

function selectInstallation(id) {
  selectedId = id;
  const inst = installations.find(i => i.id === id);
  const cat = CATEGORY[inst.type];
  map.flyTo([inst.lat, inst.lng], 15, { duration: 0.6 });

  detailContent.innerHTML = `
    <div class="detail-photo" style="background:linear-gradient(135deg, ${cat.color}, var(--primary-dark));">
      ${ICONS[cat.icon].replace('viewBox', 'width="40" height="40" viewBox')}
    </div>
    <div class="detail-body">
      <span class="type-badge" style="background:${cat.color}">${TYPE_LABELS[inst.type]}</span>
      <h2 class="display">${inst.name}</h2>
      <p class="desc">${inst.description}</p>
      <div class="tag-row">
        ${inst.techniques.map(t => `<span class="tag">${TYPE_LABELS[t] || t}</span>`).join('')}
      </div>
      <div class="meta-row"><span>Neighborhood</span><strong>${inst.neighborhood}</strong></div>
      <div class="meta-row"><span>Installed</span><strong>${inst.installed_year}</strong></div>
      <div class="meta-row"><span>Source</span><strong>${inst.source_type.replace('_',' ')}</strong></div>
      <div class="visitor-note">${inst.visitor_notes}</div>
    </div>`;
  detailPanel.classList.add('open');
  renderList();
}

renderList();
</script>
</body>
</html>
